# Pushing a tag like v0.2.0 builds the extension and publishes mosaic.zip as a GitHub release.
# The tag must match "version" in package.json:
#   bump package.json → commit → git tag v0.2.0 → git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: bun run check
      - run: bun run package
      # The asset keeps the same name every release, so releases/latest/download/mosaic.zip always works.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mosaic.zip --title "Mosaic $GITHUB_REF_NAME" --generate-notes
