<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PR Mosaic — review view mockup</title>
<style>
  html, body { margin: 0; }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .screen { background: #010409; padding: 16px; border-radius: var(--radius, 10px); height: 820px; box-sizing: border-box; }
  .standalone .screen { padding: 0; border-radius: 0; }
  .standalone .app { border: 0; border-radius: 0; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; position: relative; }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; }
  .pr { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 300px; }
  .logo { font-weight: 700; color: #2f81f7; white-space: nowrap; }
  .repo { color: #8b949e; white-space: nowrap; }

  .prog { display: flex; align-items: center; gap: 10px; flex: 1 1 240px; }
  .bar { flex: 1; height: 8px; background: #21262d; border-radius: 99px; overflow: hidden; min-width: 70px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #238636, #3fb950); transition: width .25s; }
  .prog span { color: #8b949e; white-space: nowrap; font-size: 12px; }
  .prog b { color: #e6edf3; }
  .timechip { display: flex; align-items: center; gap: 6px; background: #0d1117; border: 1px solid #30363d; border-radius: 99px; padding: 2px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; color: #8b949e; }

  .seg button.on { background: #30363d; color: #e6edf3; }
  .ctrls label { color: #8b949e; white-space: nowrap; cursor: pointer; font-size: 12px; }

  .body { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  .side { border-right: 1px solid #30363d; overflow: auto; padding: 10px 0 20px; }
  .main { overflow: auto; padding: 0 14px 30px; }
  @media (max-width: 760px) { .body { grid-template-columns: 190px 1fr; } .ctrls label { display: none; } }

  .sh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8b949e; padding: 10px 14px 4px; }
  .bk { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 14px; cursor: pointer; }
  .bk:hover { background: #161b22; }
  .bk.on { background: #1f2a3a; box-shadow: inset 2px 0 #2f81f7; }
  .bk .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bk .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk .cnt { color: #8b949e; font-size: 12px; }

  .bk .all { border: 1px solid #30363d; background: #21262d; border-radius: 5px; font-size: 11px; padding: 0 6px; cursor: pointer; color: #8b949e; }

  .v2 { font-size: 9px; border: 1px solid #a371f7; color: #a371f7; border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }

  .tn.full .nm { color: #6e7681; text-decoration: line-through; text-decoration-color: #3fb95088; }

  .tn .mini-bar i { display: block; height: 100%; background: #3fb950; }
  .tn .c { color: #6e7681; font-size: 11px; width: 26px; text-align: right; flex: none; }
  input[type=checkbox] { accent-color: #3fb950; margin: 0; cursor: pointer; }

  .sec-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 8px 4px; background: #0d1117ee; backdrop-filter: blur(4px); border-bottom: 1px solid #21262d; }

  .sec-h .p span { color: #8b949e; font-weight: 400; }
  .sec-h .m { color: #8b949e; font-size: 12px; margin-left: auto; white-space: nowrap; }
  .a { color: #3fb950; } .d { color: #f85149; }

  .tile { align-self: start; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; overflow: hidden; cursor: pointer; transition: opacity .15s; }

  .tile:hover { border-color: #484f58; }
  .tile.focus { border-color: #2f81f7; box-shadow: 0 0 0 1px #2f81f7; }

  .tile.viewed .mini { display: none; }
  .tile.viewed .fn { text-decoration: line-through; text-decoration-color: #3fb95099; }
  .th { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #161b22; font-size: 12px; }
  .st { font: 600 10px ui-monospace, monospace; width: 14px; text-align: center; flex: none; }
  .st-A { color: #3fb950; } .st-M { color: #d29922; } .st-D { color: #f85149; } .st-R { color: #a371f7; }
  .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .pill { font-size: 10px; padding: 0 5px; border-radius: 9px; border: 1px solid; white-space: nowrap; flex: none; }
  .nums { font: 11px ui-monospace, monospace; white-space: nowrap; flex: none; }

  .mini { font: var(--fs, 10.5px)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 4px 0; }
  .wide .mini { columns: 2 420px; column-gap: 0; column-rule: 1px solid #21262d; }
  .mini .ln { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 8px 0 18px; text-indent: -10px; color: #8b949e; break-inside: avoid; } /* long lines wrap, never clip */
  .ln.add { background: rgba(46,160,67,.15); color: #aff5b4; }
  .ln.del { background: rgba(248,81,73,.15); color: #ffdcd7; }
  .fold { margin: 2px 0; padding: 1px 8px; background: #121d2f; color: #6e9bd6; font: 10.5px -apple-system, sans-serif; cursor: pointer; break-inside: avoid; }
  .fold:hover { color: #9cc3ff; }
  .mini .note { padding: 6px 8px; font: 11px -apple-system, sans-serif; color: #8b949e; }

  .banner { margin-top: 14px; border: 1px solid #a371f766; background: #a371f712; border-radius: 8px; padding: 12px 14px; }
  .banner h4 { margin: 0 0 6px; font-size: 13px; }
  .banner p { margin: 0 0 8px; color: #8b949e; font-size: 12px; }
  .banner p b { color: #e6edf3; }

  .banner .diff .ln { padding: 0 10px; white-space: pre; }
  .banner .warn { margin-top: 8px; color: #79c0ff; font-size: 12px; }
  .banner button { margin-top: 10px; background: #238636; border: 1px solid #2ea043; color: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-weight: 600; }

  .dh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; }

  .dh .path span { color: #8b949e; }

  .dbody { overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .card { width: min(520px, 90%); background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px 20px; box-shadow: 0 20px 50px #000a; }
  .card h3 { margin: 0 0 2px; font-size: 15px; }
  .card .sub { color: #8b949e; font-size: 12px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .kpi { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 8px 10px; }
  .kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { color: #8b949e; font-size: 11px; }
  .kpi.good .v { color: #3fb950; }
  .card table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .card th { text-align: left; color: #8b949e; font-weight: 400; padding: 4px 0; border-bottom: 1px solid #21262d; }
  .card td { padding: 4px 0; border-bottom: 1px solid #21262d; font-variant-numeric: tabular-nums; }
  .card td.r, .card th.r { text-align: right; }
  .card .fine { color: #6e7681; font-size: 11px; margin-top: 10px; }
  .card .close { float: right; background: none; border: 0; color: #8b949e; cursor: pointer; font-size: 14px; }

  .foot { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 14px; border-top: 1px solid #30363d; background: #161b22; color: #8b949e; font-size: 11.5px; }
  kbd { font: 10.5px ui-monospace, monospace; border: 1px solid #30363d; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: #e6edf3; background: #0d1117; }
  .hint { margin-left: auto; color: #6e7681; }
</style>
</head>

    <div class="scrim" id="scrim"></div>

</div>

  const tn = t.closest('.tn');
  if (tn) { const s = [...document.querySelectorAll('.sec')].find(s => s.dataset.dir === tn.dataset.prefix || s.dataset.dir.startsWith(tn.dataset.prefix + '/')); s?.scrollIntoView({ block: 'start' }); return; }
  const tl = t.closest('.tile'); if (tl) { focusId = drawerId = +tl.dataset.id; render(); }
});
$('density').addEventListener('click', e => { const d = e.target.dataset.d; if (d) setDensity(d); });
function setDensity(d) {
  density = d; document.querySelectorAll('#density button').forEach(b => b.classList.toggle('on', b.dataset.d === d));
  $('app').style.setProperty('--tile', DENS[d].tile + 'px'); $('app').style.setProperty('--fs', DENS[d].fs); render();
}
$('hideViewed').addEventListener('change', e => { hideViewed = e.target.checked; render(); });
$('q').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
document.addEventListener('keydown', e => {
  lastInput = Date.now();
  if (e.target.tagName === 'INPUT' && e.target.type === 'search') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'j') moveFocus(1); else if (k === 'k') moveFocus(-1);
  else if (k === 'x') toggleOne(focusId);
  else if (k === 'X') { const f = files[focusId]; setMany(files.filter(g => g.dir === f.dir)); maybeDone(); moveFocus(1, true); }
  else if (k === 'Enter') { drawerId = focusId; render(); }
  else if (k === 'Escape') { drawerId = null; summaryOpen = false; render(); }
  else if (k === '1' || k === '2' || k === '3') setDensity('SML'[+k - 1]);
  else if (k === 'v') { hideViewed = !hideViewed; $('hideViewed').checked = hideViewed; render(); }
  else if (k === 't') { summaryOpen = !summaryOpen; render(); }
  else if (k === '/') { e.preventDefault(); $('q').focus(); }
  else return;
  e.preventDefault();
});
['mousemove', 'mousedown', 'wheel'].forEach(ev => document.addEventListener(ev, () => lastInput = Date.now(), { passive: true }));
setInterval(() => { if (!document.hidden && Date.now() - lastInput < 60000) { activeSec++; renderTime(); } }, 1000);
addEventListener('resize', masonry);
if (location.protocol === 'file:') {
  document.documentElement.classList.add('standalone');
  const fit = () => document.querySelector('.screen').style.height = innerHeight + 'px'; fit(); addEventListener('resize', fit);
}
setDensity('M');
console.log('files', files.length, 'identical', nIdentical, 'samePlus', nPlus, 'review', files.filter(f => f.bucket === 'review').length, 'total lines', TOTAL);
</script>
